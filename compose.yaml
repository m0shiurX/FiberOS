services:
    pgsql:
        image: imresamu/postgis:17-3.5
        ports:
            - '${FORWARD_DB_PORT:-5433}:5432'
        environment:
            PGPASSWORD: '${DB_PASSWORD:-password}'
            POSTGRES_DB: '${DB_DATABASE:-fiberos}'
            POSTGRES_USER: '${DB_USERNAME:-fiberos}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-password}'
        volumes:
            - fiberos-pgsql:/var/lib/postgresql/data
        healthcheck:
            test:
                - CMD
                - pg_isready
                - -q
                - -d
                - '${DB_DATABASE:-fiberos}'
                - -U
                - '${DB_USERNAME:-fiberos}'
            retries: 3
            timeout: 5s

volumes:
    fiberos-pgsql:
        driver: local
